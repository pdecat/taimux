# One binary, four crates.
#
# The split is not about shipping more artefacts, it is about the compiler being
# able to say no. Before it, every module could reach every other module and
# three of them reached UP into main.rs, so "the daemon does not depend on the
# terminal stack" was a claim in a comment rather than something anything
# checked. Now `taimux-core` cannot see the picker, `taimux-daemon` cannot see
# the picker either, and the only crate that links ratatui is the one that draws.
#
# It still ships as ONE binary. The installer, the tmux plugin, the launcher
# symlink and another host's ssh lookup all resolve exactly one name, and two
# artefacts would mean two of each of those for no benefit anyone using it can
# observe.
[workspace]
resolver = "2"
members = ["core", "daemon", "cli"]

# Shared metadata the members inherit. NOT the version: release-please's rust
# strategy rewrites `package.version` as a literal and cannot write through a
# `version.workspace = true` marker, which it reports as "value at path
# package.version is not tagged". So each crate carries its own literal version
# and release-please keeps all four in step, which is the job it is here to do.
[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pdecat/taimux"
homepage = "https://github.com/pdecat/taimux"
rust-version = "1.88"

# Both a path AND a version. The path is what a local build uses; the version is
# what crates.io requires, because a published crate cannot depend on a
# directory.
#
# The `x-release-please-version` annotations are load-bearing. release-please's
# rust strategy bumps every [package] version and the lockfile, and does NOT
# touch [workspace.dependencies], so without them a release PR leaves these
# three pinned to the PREVIOUS version and the workspace stops resolving:
# taimux-daemon 0.11.0 requiring taimux-core ^0.10.0 when core is 0.11.0. The
# generic updater rewrites the version on any line carrying the annotation, and
# `extra-files` in release-please-config.json is what points it at this file.
[workspace.dependencies]
taimux-core = { path = "core", version = "0.16.0" } # x-release-please-version
taimux-daemon = { path = "daemon", version = "0.16.0" } # x-release-please-version
taimux-cli = { path = "cli", version = "0.16.0" } # x-release-please-version

[package]
name = "taimux"
version = "0.16.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "List, select and jump between AI coding-agent sessions across your tmux panes, windows, sessions and hosts."
readme = "README.md"
keywords = ["tmux", "ai", "agent", "picker", "session"]
categories = ["command-line-utilities"]

# What a published crate does NOT need. The demo recording is 612 kB and the
# frozen layout fixture 334 kB, and neither is reachable from the binary: they
# exist for people working ON taimux, who have the repository. Shipping them
# would more than double the download for every `cargo install`.
exclude = ["demo/", "tests/", "scripts/", ".github/"]

[dependencies]
taimux-core = { workspace = true }
taimux-daemon = { workspace = true }
taimux-cli = { workspace = true }

# opt-level = "s" and lto because this is a picker: it is forked on a keypress and
# its startup is the latency a human feels, and it is downloaded by every host.
[profile.release]
opt-level = "s"
lto = true
strip = true
