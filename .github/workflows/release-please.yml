# Versioning and releases, off the commit messages.
#
# The commits here are already Conventional Commits, so the version does not
# need deciding: release-please reads the history, keeps a release PR open with
# the next version and the changelog it implies, and merging that PR is what cuts
# the release. Nothing is tagged by hand.
#
# What comes out is a tagged GitHub Release with the statically linked binary
# attached under a STABLE asset name.
#
# **The attach jobs below run `if: always()`, and that is the whole design.**
# Three releases went out empty before this shape was found, for two different
# reasons:
#
#   - v0.7.0 and v0.8.0: release-please tagged and published the release, then
#     failed a moment later on a GitHub GraphQL error while scanning commits for
#     the NEXT release. The jobs needed its outputs, so they skipped.
#   - v0.9.0: the jobs were moved to a separate workflow keyed on
#     `release: published`, which never fired at all. A workflow cannot be
#     triggered by an event that GITHUB_TOKEN raised, and release-please
#     publishes with `github.token`. GitHub does this to stop workflows
#     recursing, and it applies to `push: tags` just the same, so that is not a
#     way round it either.
#
# So the attach step trusts nothing about how this run went. It asks the API
# whether a release exists for the version in Cargo.toml, and attaches to it
# only when that release's TAG IS THE COMMIT THIS RUN BUILT. A run where
# release-please did nothing finds no release, or one tagged on an earlier
# commit, and exits quietly. That is how the other hosts
# get taimux, since two of them cannot build it (no cargo) and a plain build
# here would not run there anyway (glibc 2.43 on one, 2.41 on another). See
# scripts/install-release.sh, which is the downloader, and the dotfiles repo's
# run_after_30-install-taimux.sh, which calls the same API.
#
# The tag check is load-bearing, and its absence cost a release its binary.
# Cargo.toml keeps the released version until the NEXT release is cut, so on
# every ordinary push after one, "is there a release for this version" said
# yes, and the step uploaded that push's unreleased build over the released
# asset with --clobber, under the released version number: v0.17.0 was carrying
# a build of a later commit within two pushes, and the two runs one of those
# pushes set off raced each other's --clobber until one failed on a 404. The
# same holds for crates.io below, where a wrong upload cannot be taken back.
#
# Config lives in release-please-config.json plus .release-please-manifest.json.
# The parts worth knowing, since JSON cannot hold a comment:
#
#   - The package is `daemon`, because that is where Cargo.toml is, and
#     `release-type: rust` is what bumps the crate version and Cargo.lock. The
#     version in Cargo.toml is what `taimux version` prints, so the tag, the
#     crate and the binary cannot drift apart.
#   - `include-component-in-tag: false` keeps the tags `v0.2.0` rather than
#     `daemon-v0.2.0`, since there is only one thing here to release.
#   - `bump-minor-pre-major: true`: pre-1.0, a breaking change bumps the minor
#     instead of jumping to 1.0.0.
#   - Only feat, fix, perf and refactor are visible in the changelog, and
#     **visible means release-triggering**: there is no show-without-releasing in
#     release-please. refactor is deliberately in that list, because the change
#     that replaced the entire bash implementation was a refactor and a host
#     should get it. docs, test, ci, build, chore and style are hidden, so a
#     comment fix does not cut a release.
name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # The way to finish a crates.io publish that a release's own run could not.
      # The tag rule below means no later commit may publish a release, which is
      # right, and also means a re-run is the only other way to try again, and a
      # re-run replays the workflow as it was, bug and all.
      tag:
        description: "A release to finish publishing to crates.io, e.g. v0.18.0 (from that tag's own commit)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The one third-party action in this repo, and the exception is deliberate
      # rather than an oversight: ci.yml sticks to first-party `actions/*` on the
      # grounds that anything else is a third party with write access to a build
      # that produces the binary this tool runs as. release-please is Google's,
      # it runs only on main, and the alternative is running the same npm
      # package by hand from a shell step, which is the same code with more of it
      # written here. It does not build or sign anything: it opens a PR.
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Built whatever release-please did, because whether a release exists is a
  # question for the API rather than for that job's exit code.
  build:
    needs: release-please
    if: always()
    uses: ./.github/workflows/build.yml

  attach:
    needs: [release-please, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: taimux-x86_64-static

      # A STABLE asset name, not one carrying the version: the installer looks
      # the asset up by name in whatever release is latest, so putting the
      # version in it would make every downloader parse a filename to find the
      # file it already knows it wants.
      - name: attach it, if there is a release to attach it to
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The version this commit builds, which is what release-please just
          # bumped if it did anything.
          v=$(sed -n '/^\[package\]/,/^\[/p' Cargo.toml |
              sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          test -n "$v"
          tag="v$v"

          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "no release $tag: nothing was cut by this run, nothing to attach"
            exit 0
          fi

          # Only the tagged commit's own build belongs on the release. Any later
          # push still reads the released version out of Cargo.toml, and its
          # binary is code that release never contained (see the header).
          tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "$tag is $tagged, not this commit ($GITHUB_SHA): nothing to attach"
            exit 0
          fi

          chmod +x taimux
          mv taimux taimux-x86_64-linux-musl

          # The binary must agree with the tag it is published under. This check
          # was only in the installer before, one download too late, and it is
          # the failure nothing else can see: `taimux version` is how a host
          # decides whether it is current, so a mislabelled asset makes every
          # host either re-download forever or never upgrade.
          got=$(./taimux-x86_64-linux-musl version | awk '{print $2}')
          if [ "$got" != "$v" ]; then
            echo "refusing: $tag carries a binary saying $got" >&2
            exit 1
          fi

          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            taimux-x86_64-linux-musl
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            -q '.assets[] | "\(.name)  \(.size) bytes"'

  # crates.io, so `cargo install taimux` works.
  #
  # Same shape as `attach` above and for the same reason: it asks the registry
  # what exists rather than trusting how the release-please job happened to end.
  # It also makes a re-run safe, which matters more here than anywhere else in
  # this workflow, because a publish cannot be undone. A version already on
  # crates.io is skipped rather than retried into an error.
  #
  # `--workspace` rather than four invocations in dependency order: cargo works
  # the order out from the graph, verifies the crates against each other locally
  # instead of against an index that does not have them yet, and waits for the
  # index between uploads. Doing it by hand means reimplementing all three.
  # crates.io, so `cargo install taimux` works.
  #
  # **No stored token.** This authenticates by trusted publishing: the job asks
  # GitHub for an OIDC JWT, crates.io exchanges it for a temporary token, and
  # the action's post step revokes that token when the job ends. So there is no
  # long-lived credential in this repository's secrets to leak or rotate, and
  # the trust is pinned on crates.io's side to this owner, this repository and
  # THIS workflow file, which is narrower than any token could be.
  #
  # `rust-lang/crates-io-auth-action` is the second third-party action here, and
  # the exception is deliberate like release-please's: it is rust-lang's own, and
  # its entire purpose is to avoid handing a workflow the very thing the
  # first-party-only rule exists to protect.
  #
  # Configuration is PER CRATE on crates.io, and there is no pending-publisher
  # flow, so a NEW crate has to be published by hand once before it can be
  # configured. All four exist. If this job fails at the auth step, that is what
  # it means: one of them has no Trusted Publishing entry pointing at
  # release-please.yml.
  publish:
    needs: [release-please, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      # What mints the OIDC token. Without it the auth step cannot even ask.
      id-token: write
      contents: read
    steps:
      # A dispatch naming a release checks out that release's commit, which is
      # what the tag rule below then accepts; anything else is this run's own.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}

      # Decided BEFORE authenticating, so a run with nothing to publish never
      # asks crates.io for a token at all. Same rule as the attach job: ask the
      # API what exists rather than trust how release-please happened to end.
      - name: is there a release to publish, and is it already up?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n '/^\[package\]/,/^\[/p' Cargo.toml |
              sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

          if ! gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "no release v$v: this run cut nothing, nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # The same rule as the attach job, and it matters more here: a later
          # push still reads v$v out of Cargo.toml, and if the release run's own
          # publish had failed, this would put code v$v never contained on
          # crates.io under its number, for good. Checked against what was
          # checked out rather than $GITHUB_SHA, which a dispatch naming a
          # release does not share.
          head=$(git rev-parse HEAD)
          tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/v$v" --jq .sha)
          if [ "$tagged" != "$head" ]; then
            echo "v$v is $tagged, not this commit ($head): nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Already there: a re-run, or a hand-publish that got in first. Asking
          # costs one request and an unnecessary upload is not recoverable.
          #
          # The User-Agent is REQUIRED, not politeness: crates.io answers 403 to
          # curl's default one, `-f` turns that into a failure, and this guard
          # then reads "not published" for a version that is. It did exactly
          # that once, and the only visible symptom was the auth step running on
          # a push that had nothing to publish.
          if curl -sf -H "User-Agent: taimux-release (github.com/$GITHUB_REPOSITORY)" \
               "https://crates.io/api/v1/crates/taimux/$v" >/dev/null 2>&1; then
            echo "taimux $v is already on crates.io, nothing to do"
            echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: steps.gate.outputs.publish == 'true'

      # --no-verify because the crates were already built and tested by `check`
      # on this exact commit; re-verifying here would rebuild all four to learn
      # what CI already knows.
      #
      # **In rounds, leaving out whatever is already up**, because one pass is
      # not enough and cannot be retried as it stands. After each upload cargo
      # waits for the index to show the crate before it packages the crates that
      # need it, and it waits 60 s: fixed on stable, since `publish.timeout` is
      # only read under the nightly `-Zpublish-timeout`. On v0.18.0 the index
      # took longer, so taimux-core went up and the other three were abandoned.
      # A plain re-run then fails outright: cargo checks EVERY crate against the
      # registry before uploading any, and refuses the lot over the one that
      # exists (`crate taimux-core@0.18.0 already exists`). So each round asks
      # crates.io which crates are up and excludes those, and a round cut short
      # by the index is simply followed by another once it has caught up. The
      # same loop is what a re-run or a dispatch naming the release goes through.
      - name: cargo publish --workspace
        if: steps.gate.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          V: ${{ steps.gate.outputs.version }}
        run: |
          mapfile -t crates < <(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.publish == null or (.publish | length) > 0) | .name')
          # An empty list would read below as "all 0 of them are up" and pass
          # having published nothing, and a failed `cargo metadata` gives one.
          if [ "${#crates[@]}" -eq 0 ]; then
            echo "no publishable crates found in the workspace" >&2
            exit 1
          fi
          ua="User-Agent: taimux-release (github.com/$GITHUB_REPOSITORY)"
          for round in 1 2 3 4 5 6; do
            exclude=()
            for c in "${crates[@]}"; do
              if curl -sf -H "$ua" "https://crates.io/api/v1/crates/$c/$V" >/dev/null 2>&1; then
                exclude+=(--exclude "$c")
              fi
            done
            if [ $(( ${#exclude[@]} / 2 )) -eq "${#crates[@]}" ]; then
              echo "all ${#crates[@]} crates are on crates.io at $V"
              exit 0
            fi
            echo "round $round: ${#crates[@]} crates, $(( ${#exclude[@]} / 2 )) already up"
            if cargo publish --workspace --no-verify "${exclude[@]}"; then
              exit 0
            fi
            echo "round $round did not finish; giving the index a minute"
            sleep 60
          done
          echo "still not all up after $round rounds" >&2
          exit 1
