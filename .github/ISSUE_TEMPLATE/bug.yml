name: Bug report
description: Something taimux does wrong, or does not do
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        The four fields below are asked for because a report without them
        almost always needs a round trip before anyone can start.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
      placeholder: |
        Pressed prefix + a, the popup opened empty.
        Expected the two claude panes in this session to be listed.
    validations: {required: true}
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Output of the commands below, as they come.
      value: |
        taimux version :
        tmux -V        :
        agent + version:   (e.g. claude 2.1.263)
        distro + kernel:   (uname -sr, and your distro)
      render: text
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: |
        `demo/demo.sh` builds synthetic sessions in an isolated tmux server. If
        the bug shows up there, say so: it makes the report reproducible for
        someone who cannot see your machine.
    validations: {required: false}
  - type: checkboxes
    id: scrub
    attributes:
      label: Before you paste
      options:
        - label: >
            I have checked that any pasted rows, previews or transcript
            snippets carry nothing private. taimux shows what your sessions are
            working on, so its output is worth a second look before it goes in
            a public issue.
          required: true
