# The daemon: a memo pad, not a worker.
#
# It holds one version prober and one 750 ms screen cache across connections so a
# refreshing picker does not redo that work every few seconds. Everything it
# answers, a client can also work out alone, which is why every caller falls back
# instead of failing when nothing is listening.
#
# Like core, no external dependencies, and for the same reason: nothing on this
# path draws anything.
[package]
name = "taimux-daemon"
version = "0.15.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Collection daemon and socket protocol for taimux."

[dependencies]
taimux-core = { workspace = true }
