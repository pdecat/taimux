# The half that has no opinion about terminals.
#
# It had ZERO external dependencies, and that was a property worth keeping rather
# than an accident: everything here is /proc, tmux plumbing, transcript reading
# and the protocol's vocabulary, none of which needs a crate.
#
# ONE crate now earns its place, and only behind a feature. Two agents keep their
# conversations in SQLite rather than in files (OpenCode, and recent Codex), and
# reading a b-tree by hand is several hundred lines that have to be right about
# overflow pages and WAL frames. `--no-default-features` drops it, and with it
# those two agents' rows, which is the only thing it can affect.
#
# It was turso, a SQLite rewritten in Rust, taken on the understanding that that
# made it C-free. It does not: `turso_core` depends on `simsimd`, a C SIMD
# library, mandatorily and not behind a feature. With that argument gone the
# measurement was one-sided, so this is rusqlite: 1.49 MB of static binary
# against 11.9, a 15s cold build against 75, 32 crates against 324, and a real
# SQLITE_OPEN_READ_ONLY that turso does not offer.
[package]
name = "taimux-core"
version = "0.17.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Shared internals for taimux: pane scanning, transcripts, agent versions, paths."

[features]
default = ["sqlite"]
# read OpenCode's and Codex's SQLite session stores
sqlite = ["dep:rusqlite"]

[dependencies]
# `bundled` compiles SQLite's own amalgamation in, so there is no system libsqlite3
# to find at build time or at run time, which is what a single static artefact
# needs. Default features otherwise: they are the C library's own, and small.
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
