# The half that has no opinion about terminals.
#
# ZERO external dependencies, and that is a property worth keeping rather than an
# accident: everything here is /proc, tmux plumbing, transcript reading and the
# protocol's vocabulary, none of which needs a crate. `cargo tree -p taimux-core`
# showing nothing is the test.
[package]
name = "taimux-core"
version = "0.9.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Shared internals for taimux: pane scanning, transcripts, agent versions, paths."

[dependencies]
